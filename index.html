<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Diary Petualangan Panca Cinta - KbC Kemenag RI</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Baloo+2:wght@600;700;800&family=Amiri&display=swap" rel="stylesheet">
<style>
:root{--g:#0e9a4f;--gd:#165c4f;--o:#f58220;--m:#d6f0d6;--cr:#fffaf0;--tx:#1f2d27;--bd:#cfe3d4}
*{box-sizing:border-box}
body{margin:0;font-family:'Quicksand',system-ui,sans-serif;color:var(--tx);background:var(--cr)}
h1,h2,h3,h4,.tag,.logo b{font-family:'Baloo 2','Quicksand',sans-serif}
.arabic{font-family:'Amiri',serif;font-size:22px;line-height:2.2;text-align:right;direction:rtl;color:var(--gd);background:#f0f7f2;padding:12px;border-radius:12px;border-right:4px solid var(--g);margin:10px 0}
header{position:sticky;top:0;z-index:99;background:var(--gd);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;box-shadow:0 2px 10px #0002}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:18px}.logo b{letter-spacing:.5px}
header .sp{flex:1}
header button{background:#ffffff22;color:#fff;border:0;border-radius:20px;padding:6px 14px;font:700 13px Quicksand;cursor:pointer;transition:.2s}
header button:hover{background:#ffffff44}
#qb{background:var(--o)!important;display:none;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.wrap{display:flex;min-height:calc(100vh - 52px)}
nav{width:260px;background:var(--m);padding:14px 10px;flex-shrink:0;position:sticky;top:52px;align-self:flex-start;height:calc(100vh - 52px);overflow:auto}
nav a{display:flex;align-items:center;gap:8px;padding:9px 10px;margin-bottom:6px;border-radius:12px;color:var(--gd);font-weight:700;font-size:13.5px;text-decoration:none;background:#ffffffaa;border-left:6px solid var(--c,var(--g));transition:.2s}
nav a:hover,nav a.on{background:#fff;box-shadow:0 2px 8px #0002;transform:translateX(2px)}
nav a i{margin-left:auto;font-style:normal;font-size:12px;opacity:.85;background:#ffffffdd;padding:2px 6px;border-radius:10px}
main{flex:1;min-width:0;padding:0 0 60px}
.in{max-width:920px;margin:0 auto;padding:18px}
.ban{background:var(--m);position:relative;overflow:hidden;padding:34px 22px 70px;text-align:center;border-bottom:3px solid var(--bd)}
.ban h2{font-size:32px;margin:6px 0;color:var(--gd);text-transform:uppercase;line-height:1.1}.ban small{font-weight:700;color:#3a7a54;letter-spacing:2px}
.ban svg{position:absolute;bottom:0;left:0;width:100%;height:60px}.big{font-size:56px}
.card{background:#fff;border:2px solid var(--bd);border-radius:20px;padding:18px 20px;margin:16px 0;box-shadow:0 4px 0 var(--bd)}
.card.D{background:#fff8ee;border-color:#f7c48a;box-shadow:0 4px 0 #f7c48a}
.tag{display:inline-block;background:var(--g);color:#fff;border-radius:20px;padding:2px 14px;font-size:12px;font-weight:700;letter-spacing:1px}.D .tag,.P .tag{background:var(--o)}.R .tag{background:#2a8fc9}
.card h3{margin:8px 0;color:var(--gd);font-size:21px;line-height:1.3}
.ins{margin:6px 0 12px;line-height:1.6;white-space:pre-line;color:#2c3e35}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px;color:var(--gd)}
textarea,input,select{width:100%;font:500 15px Quicksand;border:2px solid var(--bd);border-radius:12px;padding:10px 12px;background:#fffffa;color:var(--tx);transition:.2s}
textarea{resize:vertical;background-image:repeating-linear-gradient(transparent 0 25px,#d9e8dc 25px 26px);line-height:26px}
textarea:focus,input:focus,select:focus{outline:0;border-color:var(--g);background:#fff;box-shadow:0 0 0 3px #0e9a4f22}
.ck{display:flex;gap:8px;align-items:flex-start;font-weight:600;margin:7px 0;cursor:pointer}.ck input{width:auto;margin-top:4px;cursor:pointer}
.gr{display:flex;gap:8px;align-items:center;margin:8px 0;background:#f9fdfa;padding:8px 12px;border-radius:10px;border:1px solid #e1efe4}
.gr span{flex:1;font-size:13.5px;font-weight:700;color:var(--gd)}
.gr select{flex:0 0 130px}.gr input{flex:1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
.pair h5{margin:0;background:#718096;color:#fff;padding:8px 12px;border-radius:10px 10px 0 0;font:800 14px 'Baloo 2'}
.pair .kb h5{background:var(--g)}
.pair small{display:block;font-size:12.5px;line-height:1.45;padding:8px 10px;background:#f0f4f1;min-height:70px;border-bottom:1px solid #ddd}
.act{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.sv{font-size:12.5px;font-weight:700;color:#4a5568}
.btn{background:var(--o);color:#fff;border:0;border-radius:24px;padding:10px 22px;font:700 14px Quicksand;cursor:pointer;box-shadow:0 4px 0 #c4640f;transition:.1s}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c4640f}
.btn.g{background:var(--g);box-shadow:0 4px 0 #0a7039}
.res{background:var(--m);border-radius:14px;padding:14px;margin-top:12px;font-weight:700;color:var(--gd);border:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.kc{border-radius:18px;padding:16px;color:#fff;background:var(--c);cursor:pointer;text-decoration:none;box-shadow:0 5px 0 #0003;display:block;transition:.2s}
.kc:hover{transform:translateY(-3px)}
.kc h4{margin:6px 0;font-size:18px}.bar{height:10px;background:#fff5;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:6px;transition:.4s}
.bar.d{background:#e3eee6}.bar.d i{background:var(--c,var(--g))}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}.row b{flex:0 0 200px;font-size:13.5px;color:var(--gd)}
.row .bar{flex:1}.row em{width:45px;font-style:normal;font-weight:700;font-size:13px;text-align:right}
.hero{background:linear-gradient(135deg,#e6f6e3,#d6f0d6);border-radius:24px;padding:26px;margin-top:8px;display:flex;gap:20px;align-items:center;border:2px solid var(--bd)}
.hero svg{flex:0 0 120px}.mut{color:#5a6a60;font-size:13.5px}
.nx{display:flex;justify-content:space-between;margin-top:28px}
.rg{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--g) calc(var(--p)*1%),#dcebdf 0);font:800 18px 'Baloo 2'}
.rg span{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}td,th{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left}
th{background:#f0f7f2;color:var(--gd);font-weight:700}
/* Custom Modal Style */
.modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:999;opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-box{background:#fff;padding:24px;border-radius:20px;max-width:400px;width:90%;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.2);transform:scale(0.9);transition:transform .2s ease}
.modal-overlay.active .modal-box{transform:scale(1)}
.modal-box h4{margin:0 0 8px;color:var(--gd);font-size:20px}
.modal-box p{margin:0 0 20px;color:#4a5568;font-size:14px;line-height:1.5}
@media(max-width:768px){.wrap{display:block}nav{width:auto;height:auto;position:static;display:flex;overflow:auto;gap:6px;padding:8px}nav a{white-space:nowrap;margin:0;flex:0 0 auto}.pair{grid-template-columns:1fr}.gr{flex-wrap:wrap}.gr span{flex:1 0 100%}.hero{flex-direction:column;text-align:center}.row b{flex-basis:120px}.ban h2{font-size:24px}}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="location.hash=''">
    <svg width="32" height="32" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#fff"/><path d="M20 33V19" stroke="#0e9a4f" stroke-width="3.5" stroke-linecap="round"/><path d="M20 21C20 13 13 10 8 11c0 7 5 11 12 10z" fill="#0e9a4f"/><path d="M20 18c0-6 6-9 11-8 0 6-5 10-11 8z" fill="#f58220"/></svg>
    <b>Diary Petualangan Panca Cinta</b>
  </div>
  <span class="sp"></span>
  <button id="qb" onclick="flush()"></button>
</header>

<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<!-- Custom Dialog Modal -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-box">
    <h4 id="modalTitle">Pemberitahuan</h4>
    <p id="modalMsg"></p>
    <button class="btn g" onclick="closeModal()">Mengerti</button>
  </div>
</div>

<script>
const CONFIG_API = "https://script.google.com/macros/s/AKfycbx13_cdNLvjlpFJDz01BkVYFqa2famk6iBp-MaqYAEAuXIPi2Qv8EMwDZbo-PRzeuEE/exec";

const API = CONFIG_API;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showModal(msg, title = 'Pemberitahuan') {
  $('#modalTitle').textContent = title;
  $('#modalMsg').textContent = msg;
  $('#modalOverlay').classList.add('active');
}

function closeModal() {
  $('#modalOverlay').classList.remove('active');
}

const CH = [
  { n: 'Pembuka', s: 'Discover · Dream · Design · Destiny', c: '#f58220', e: '🌱' },
  { n: 'Cinta Allah dan Rasul-Nya', c: '#0e9a4f', e: '🍵' },
  { n: 'Cinta Ilmu', c: '#2a8fc9', e: '📖' },
  { n: 'Cinta Alam', c: '#5fa83a', e: '🌿' },
  { n: 'Cinta Diri dan Sesama Manusia', c: '#d94f86', e: '💞' },
  { n: 'Cinta Tanah Air', c: '#e08a1e', e: '🏝️' }
];

const KIND = { D: 'DISCOVER / DIARY', A: 'AKTIVITAS', R: 'REFLEKSI', K: 'KONSEP & TAFAKKUR', P: 'APLIKASI & TANTANGAN' };
const ICO = { D: '🧭', A: '🌱', R: '❓', K: '🔑', P: '✅' };

const S = [];
const add = (ch, k, t, p, f, ar) => S.push({ id: `c${ch}s${S.filter(x => x.ch === ch).length + 1}`, ch, k, t, p, f, ar });

const T = (k, l, r = 4) => ({ k, l, t: 't', r });
const I = (k, l) => ({ k, l, t: 'i' });
const SEL = (k, l, o) => ({ k, l, t: 's', o });
const CK = (k, l, o) => ({ k, l, t: 'c', o });
const G = (k, l, rows, o, ph) => ({ k, l, t: 'g', rows, o, ph });
const P = (k, a, ha, b, hb) => ({ k, t: 'p', a, ha, b, hb });

const RF = (ch, t, qs, p) => add(ch, 'R', t, p, qs.map((q, i) => T('q' + i, (i + 1) + '. ' + q)));
const MP = (ch, t, a, ha, b, hb) => add(ch, 'K', t, 'Tulis, baca, maknai dan diskusikan. Catat pemahaman Anda pada kedua kolom.', [P('m', 'Mindset Umum — ' + a, ha, 'Mindset KbC — ' + b, hb)]);

const AD = ['Tikar','Gunting','Cermin','Kemah','Tabung panah','Busur panah','Perisai','Baju perang berlapis tembaga','Tembok / benteng pertahanan','Tongkat','Pelana kuda','Gelas','Mangkok','Pedang yang sering dipakai berperang'];

const BIBIT_BULLY = [
  {n:'1. Name-Calling',d:'Memanggil dengan julukan, ejekan, nama orang tua, atau panggilan yang tidak disukai.'},
  {n:'2. Mocking',d:'Menirukan perkataan atau sikap orang lain dengan tujuan mengolok-olok.'},
  {n:'3. Stereotyping',d:'Mengolok-olok & membicarakan hal negatif tentang identitas (suku, agama, status ekonomi, gender).'},
  {n:'4. Body Shaming',d:'Mengomentari dengan tujuan mempermalukan bentuk tubuh atau kekurangan fisik.'},
  {n:'5. Teasing',d:'Mempermalukan di hadapan umum atau menyoraki karena kesalahan/kekurangan.'},
  {n:'6. Scapegoating',d:'Menyalahkan atau mengkambinghitamkan orang lain yang tidak bersalah.'},
  {n:'7. Bad Words',d:'Mengatakan kata-kata kotor, jorok, atau kasar.'},
  {n:'8. Oppressing',d:'Merasa berkuasa, menindas, menyuruh-nyuruh teman.'},
  {n:'9. Roasting',d:'Menjadikan kekurangan/kesalahan seseorang sebagai bahan candaan/jokes.'},
  {n:'10. Discrimination',d:'Melarang orang yang berbeda/punya kekurangan untuk bergabung dalam kelompok/kegiatan.'},
  {n:'11. Repression',d:'Menekan hingga orang lain takut menyatakan pendapat atau beraktivitas.'},
  {n:'12. Expulsion',d:'Mengusir teman dari kelompok.'},
  {n:'13. Alienation',d:'Mengasingkan teman dan membiarkan teman merasa sendiri tanpa memiliki teman.'},
  {n:'14. Segregation',d:'Geng-gengan, hanya bergaul dengan kelompok itu-itu saja dan tidak mau berbaur.'},
  {n:'15. Destruction',d:'Melakukan penyerangan fisik atau merusak barang.'},
  {n:'16. Harassment',d:'Jail dan menyakiti, sehingga orang di sekitar merasa tidak aman & nyaman.'},
  {n:'17. Defacement',d:'Membuat tulisan/grafiti untuk menghina atau menyakiti.'},
  {n:'18. Satire',d:'Menyindir atau menyerang seseorang secara tidak langsung.'},
  {n:'19. Trolling',d:'Mengatakan sesuatu/provokasi yang memancing perselisihan dan pertengkaran.'},
  {n:'20. Gossip',d:'Membicarakan rumor yang belum jelas kebenarannya atau keburukan orang lain di belakang.'}
];

// ---- BAB 0: ORIENTASI
add(0, 'D', 'Diary Ini Milik', `Selamat bergabung di petualangan seru ini! Anda berperan menjadi seorang petani yang penuh cinta dan dedikasi. Anda diwarisi koleksi benih-benih langka yang menjadi harapan terakhir kehidupan. 
    Jika benih-benih ini bisa dirawat dan dibudidayakan, maka pohon-pohon yang tumbuh dari benih ini bisa menjadi sumber kehidupan. Sebaliknya, jika benih-benih ini mati, maka pohon-pohon ini akan punah, dunia akan hilang keseimbangan. Tanam dan rawatlah benih ini hingga tumbuh menjadi pohon yang digambarkan pada ayat berikut ini: 
"... seperti pohon yang baik, akarnya kuat, cabangnya (menjulang) ke langit, dan menghasilkan buahnya pada setiap waktu dengan seizin Pemeliharanya" (QS Ibrahim: 24–26).`, [
  I('nama', 'Nama Pemilik Diary'),
  I('nip','NIP/NIK'),
  I('instansi', 'Sekolah / Madrasah / Pesantren / Instansi'),
  SEL('peran', 'Peran Pendidik', ['Guru', 'Kepala Madrasah', 'Pengawas','Pengasuh Pesantren', 'Fasilitator', 'Lainnya'])
]);

add(0, 'D', 'Eksplorasi Ajaran Cinta dalam Islam', 'Benih ini ibarat cinta yang menjadi esensi dari agama. Tuliskan apa saja ajaran Islam yang Anda ketahui yang mengandung pesan-pesan cinta.', [
  CK('ck', 'Centang ajaran cinta yang sudah Anda kenali:', [
    'Allah Ar-Rahman Ar-Rahim',
    'Rasulullah diutus sebagai rahmat bagi semesta alam',
    'Kasih sayang kepada sesama makhluk',
    'Akhlak mulia & menebar salam',
    'Memaafkan dan berlapang dada',
    'Menyayangi anak yatim, kaum lemah, hewan & tumbuhan'
  ]),
  T('t', 'Tuliskan ajaran Islam lain yang mengandung pesan cinta', 5)
]);

add(0, 'D', 'Ancaman dan Tantangan: Defisit Cinta', 'Tuliskan apa saja tantangan dan masalah yang terjadi saat ini di dunia dan pendidikan yang merupakan dampak dari defisit cinta.', [
  T('t', 'Tantangan & masalah nyata akibat defisit cinta', 6)
]);

add(0, 'D', 'Formula Panca Cinta sebagai Jawaban', 'Bagaimana formula Panca Cinta bisa menjadi jawaban bagi kondisi dunia yang tengah defisit cinta ini? Apa yang bisa Anda lakukan?', [
  T('a', 'Panca Cinta sebagai jawaban kondisi zaman', 5),
  T('b', 'Aksi nyata yang akan saya lakukan sebagai Petani Cinta', 5)
]);

// ---- BAB 1: CINTA ALLAH DAN RASUL-NYA
add(1, 'A', 'Merasakan Kehadiran Allah di Secangkir Teh', '1. Anda akan menerima secangkir teh hangat. Terima dengan senyuman, ucapkan terima kasih.\n2. Genggam di tangan, JANGAN DULU DIMINUM.\n3. Simak cerita perjalanan secangkir teh ini dengan penuh perhatian.', [
  T('c', 'Catatan pengalaman dan kesan Anda saat memegang secangkir teh hangat', 3)
]);

RF(1, 'Refleksi Secangkir Teh', [
  'Mengapa teh yang diminum tadi terasa istimewa? Apa yang membuatnya jadi istimewa dan bermakna?',
  'Mengapa aktivitas sehari-hari yang kita lakukan terasa biasa-biasa saja, tidak istimewa?',
  'Bagaimana agar dalam setiap aktivitas kita bisa menghadirkan Allah?'
]);

add(1, 'K', 'Tadabbur QS Al-Waqi’ah 63–73', 'Tulis, baca, maknai dan diskusikan QS Al-Waqi’ah 63–73. Siapa yang menumbuhkan benih yang kita tanam, menurunkan air yang kita minum, dan menyalakan api yang kita gunakan?', [
  T('m', 'Makna dan perenungan ayat bagi hidup saya', 5)
], `أَفَرَأَيْتُمْ مَا تَحْرُثُونَ (63) أَأَنْتُمْ تَزْرَعُونَهُ أَمْ نَحْنُ الزَّارِعُونَ (64) لَوْ نَشَاءُ لَجَعَلْنَاهُ حُطَامًا فَظَلْتُمْ تَفَكَّهُونَ (65) إِنَّا لَمُغْرَمُونَ (66) بَلْ نَحْنُ مَحْرُومُونَ (67) أَفَرَأَيْتُمُ الْمَاءَ الَّذِي تَشْرَبُونَ (68) أَأَنْتُمْ أَنْزَلْتُمُوهُ مِنَ الْمُزْنِ أَمْ نَحْنُ الْمُنْزِلُونَ (69) لَوْ نَشَاءُ جَعَلْنَاهُ أُجَاجًا فَلَوْلَا تَشْكُرُونَ (70) أَفَرَأَيْتُمُ النَّارَ الَّتِي تُورُونَ (71) أَأَنْتُمْ أَنْشَأْتُمْ شَجَرَتَهَا أَمْ نَحْنُ الْمُنْشِئُونَ (72) نَحْنُ جَعَلْنَاهَا تَذْكِرَةً وَمَتَاعًا لِلْمُقْوِينَ (73)`);

MP(1, 'Allah Sang Mahacinta', 'JALALIYAH', 'Sisi Jalaliyah Allah lebih menonjol, sehingga Allah digambarkan terutama sebagai penghukum.', 'JAMALIYAH', 'Sisi Jamaliyah lebih menonjol; Allah digambarkan penuh cinta. "Rahmatii sabaqat ghadhabii" (Welas asih-Ku mendahului murka-Ku).');

add(1, 'K', 'Hadits 100 Rahmat Allah', 'Renungkan hadits kasih sayang Allah berikut ini.', [
  T('m', 'Catatan pemahaman dan rasa syukur atas 100 Rahmat Allah', 4)
], `عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: إِنَّ لِلَّهِ مِائَةَ رَحْمَةٍ أَنْزَلَ مِنْهَا رَحْمَةً وَاحِدَةً بَيْنَ الْجِنِّ وَالْإِنسِ وَالْبَهَائِمِ وَالْهَوَامِّ، فَبِهَا يَتَعَاطَفُونَ، وَبِهَا يَتَرَاحَمُونَ... وَأَخَّرَ اللَّهُ تِسْعًا وَتِسْعِينَ رَحْمَةً يَرْحَمُ بِهَا عِبَادَهُ يَوْمَ الْقِيَامَةِ`);

MP(1, 'Nabi Sosok Penuh Cinta', 'PERANG', 'Peran politik dan pemimpin militer cukup menonjol. Episode perang mendominasi sirah Nabi.', 'DAMAI', 'Peran sipil, moral dan spiritual lebih dominan. Dari 23 tahun misi kenabian, kurang dari 10% peran militer.');
MP(1, 'Al-Qur’an Kitab Cinta', 'NOMOS ORIENTED', 'Islam sering dipandang secara Nomos Oriented: fokus pada aspek hukum atau syariat semata.', 'EROS ORIENTED', 'Ayat hukum kurang dari 30%. Al-Qur’an didominasi pesan moral melalui kisah; 13 tahun periode Mekah fokus pada tauhid & cinta.');

add(1, 'P', 'Cek Mode Ibadah Kita', 'Ayo cek, berada pada mode mana kita saat ibadah kepada Allah? Budak (push: paksaan & ancaman neraka), Pedagang (pull: iming-iming pahala), atau Pecinta.', [

const ls = {
  get: k => { try { return localStorage.getItem(k); } catch(e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} }
};

let st = JSON.parse(ls.get('kbc') || 'null') || {
  pid: '',
  a: {},
  q: []
};

let tm;
const save = () => { clearTimeout(tm); tm = setTimeout(() => ls.set('kbc', JSON.stringify(st)), 400); };
const tr = x => (x || '').toString().trim();

function sc(f, v) {
  if (v == null) return 0;
  switch (f.t) {
    case 'c': return Array.isArray(v) && v.length ? 1 : 0;
    case 'g': return f.rows.filter((_, i) => v[i] && (tr(v[i][0]) || tr(v[i][1]))).length / f.rows.length;
    case 'p': return (tr(v.u) ? 0.5 : 0) + (tr(v.k) ? 0.5 : 0);
    case 'x': return Object.values(v).some(n => +n > 0) ? 1 : 0;
    default: return tr(v) ? 1 : 0;
  }
}

const fp = s => s.f.reduce((a, f) => a + sc(f, st.a[s.id + '.' + f.k]), 0) / s.f.length;
const pc = ch => {
  const x = S.filter(s => s.ch === ch);
  return x.length ? Math.round(100 * x.reduce((a, s) => a + fp(s), 0) / x.length) : 0;
};
const pAll = () => Math.round(100 * S.reduce((a, s) => a + fp(s), 0) / S.length);

const prof = () => ({
  nama: st.a['c0s1.nama'] || '',
  nip: st.a['c0s1.nip'] || '',
  instansi: st.a['c0s1.instansi'] || '',
  peran: st.a['c0s1.peran'] || ''
});

const co2 = o => {
  o = o || {};
  const m = 30 * ((+o.motor || 0) * 0.1 + (+o.mobil || 0) * 0.2 + (+o.ac || 0) * 0.9 + (+o.elek || 0) * 0.13);
  return { kg: m, tr: Math.ceil(m * 12 / 21) };
};

function str(f, v) {
  if (v == null) return '';
  switch (f.t) {
    case 'c': return Array.isArray(v) ? v.join('; ') : String(v);
    case 'g': return f.rows.map((r, i) => v[i] && (tr(v[i][0]) || tr(v[i][1])) ? r + ' → ' + [v[i][0], v[i][1]].filter(tr).join(' | ') : '').filter(Boolean).join('\n');
    case 'p': return 'UMUM: ' + (v.u || '') + '\nKBC: ' + (v.k || '');
    case 'x': return `Motor ${v.motor || 0} km/hr, Mobil ${v.mobil || 0} km/hr, AC ${v.ac || 0} jam/hr, Elek ${v.elek || 0} jam/hr → ±${co2(v).kg.toFixed(1)} kg CO2/bln, ${co2(v).tr} pohon/thn`;
    default: return String(v);
  }
}

function fld(s, f) {
  const v = st.a[s.id + '.' + f.k];
  const L = f.l ? `<label>${esc(f.l)}</label>` : '';
  const opt = (o, x) => o.map(y => `<option${x === y ? ' selected' : ''}>${esc(y)}</option>`).join('');

  switch (f.t) {
    case 't':
      return `<div>${L}<textarea data-k="${f.k}" rows="${f.r}">${esc(v)}</textarea></div>`;
    case 'i':
      return `<div>${L}<input data-k="${f.k}" value="${esc(v)}"></div>`;
    case 's':
      return `<div>${L}<select data-k="${f.k}"><option value="">— pilih —</option>${opt(f.o, v)}</select></div>`;
    case 'c': {
      const arr = Array.isArray(v) ? v : [];
      return `<div>${L}${(f.o || []).map(o => `<label class="ck"><input type="checkbox" data-k="${f.k}" data-c="${esc(o)}"${arr.includes(o) ? ' checked' : ''}>${esc(o)}</label>`).join('')}</div>`;
    }
    case 'g':
      return `<div>${L}${f.rows.map((r, i) => {
        const x = (v && v[i]) || ['', ''];
        return `<div class="gr"><span>${esc(r)}</span>${f.o ? `<select data-k="${f.k}" data-i="${i}" data-p="s"><option value="">—</option>${opt(f.o, x[0])}</select>` : ''}<input data-k="${f.k}" data-i="${i}" data-p="t" placeholder="${esc(f.ph || '')}" value="${esc(x[1])}"></div>`;
      }).join('')}</div>`;
    case 'p': {
      const o = v || {};
      return `<div class="pair"><div><h5>${esc(f.a)}</h5><small>${esc(f.ha)}</small><textarea data-k="${f.k}" data-f="u" rows="7">${esc(o.u)}</textarea></div><div class="kb"><h5>${esc(f.b)}</h5><small>${esc(f.hb)}</small><textarea data-k="${f.k}" data-f="k" rows="7">${esc(o.k)}</textarea></div></div>`;
    }
    case 'x': {
      const o = v || {};
      return `<div class="grid">${[['motor', 'Motor (km/hari)'], ['mobil', 'Mobil (km/hari)'], ['ac', 'AC (jam/hari)'], ['elek', 'Elektronik lain (jam/hari)']].map(([k, l]) => `<div><label>${l}</label><input type="number" min="0" step="any" data-k="${f.k}" data-f="${k}" value="${esc(o[k])}"></div>`).join('')}</div><div class="res" id="r-${s.id}"></div>`;
    }
  }
}

const secH = s => `
  <article class="card ${s.k}" id="${s.id}">
    <span class="tag">${ICO[s.k]} ${KIND[s.k]}</span>
    <h3>${esc(s.t)}</h3>
    ${s.ar ? `<div class="arabic">${esc(s.ar)}</div>` : ''}
    ${s.p ? `<p class="ins">${esc(s.p)}</p>` : ''}
    ${s.f.map(f => fld(s, f)).join('')}
    <div class="act">
      <span class="sv" id="sv-${s.id}"></span>
      <button class="btn" onclick="sub('${s.id}')">☁️ Simpan &amp; Kirim</button>
    </div>
  </article>
`;

const HILL = '<svg viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 30Q100 5 200 28T400 20V60H0z" fill="#8fd18f"/><path d="M0 45Q120 25 240 44T400 38V60H0z" fill="#6b4a2f"/></svg>';
const SPR = c => `<svg viewBox="0 0 60 70" width="64"><path d="M30 68V30" stroke="#3b7a3b" stroke-width="4" stroke-linecap="round"/><path d="M30 34C30 18 16 14 6 16c0 14 10 20 24 18z" fill="${c}"/><path d="M30 28c0-12 12-17 23-15 0 12-10 19-23 15z" fill="#f58220"/></svg>`;

function nav() {
  $('#nav').innerHTML = [
    '<a href="#" data-h=""><span>🏡</span>Beranda Utama</a>',
    ...CH.map((c, i) => `<a href="#c${i}" data-h="c${i}" style="--c:${c.c}"><span>${c.e}</span>${i ? 'Panca Cinta #' + i + ': ' : ''}${esc(c.n)}<i data-pc="${i}">0%</i></a>`),
    '<a href="#dash" data-h="dash"><span>📊</span>Dashboard Progres</a>'
  ].join('');
}

function route() {
  const h = location.hash.slice(1);
  const m = $('#main');
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.h === h));
  window.scrollTo(0, 0);

  if (/^c[0-5]$/.test(h)) {
    const i = +h[1], c = CH[i];
    m.innerHTML = `
      <div class="ban" style="background:${i ? 'var(--m)' : '#ffe9cc'}">
        <small>${i ? 'PANCA CINTA #' + i : 'DISCOVER · DREAM · DESIGN · DESTINY'}</small>
        <div class="big">${c.e}</div>
        <h2>${esc(c.n)}</h2>
        ${HILL}
      </div>
      <div class="in">
        ${S.filter(s => s.ch === i).map(secH).join('')}
        <div class="nx">
          ${i > 0 ? `<a class="btn g" style="text-decoration:none" href="#c${i-1}">← Bab Sebelumnya</a>` : '<span></span>'}
          <a class="btn" style="text-decoration:none" href="#${i < 5 ? 'c' + (i + 1) : 'dash'}">${i < 5 ? 'Bab Berikutnya →' : 'Lihat Dashboard →'}</a>
        </div>
      </div>
    `;
    S.filter(s => s.ch === i).forEach(s => { if (s.f.some(f => f.t === 'x')) upd(s.id); });
  } else if (h === 'dash') {
    dash();
  } else {
    home();
  }
  prg();
}

function home() {
  $('#main').innerHTML = `
    <div class="in">
      <div class="hero">
        ${SPR('#0e9a4f')}
        <div>
          <h2 style="margin:0;color:var(--gd)">Selamat Berpetualang, Petani Cinta!</h2>
          <p class="ins">Anda diwarisi benih-benih langka yang hampir punah dan menjadi harapan terakhir kehidupan. Rawat dengan formula rahasia <b>Panca Cinta</b> agar tumbuh menjadi pohon yang akarnya kuat, cabangnya menjulang ke langit, dan berbuah setiap waktu (QS Ibrahim 24–26).</p>
          <a class="btn" style="text-decoration:none;display:inline-block;margin-top:6px" href="#c0">Mulai Petualangan 🌱</a>
        </div>
      </div>
      <h3 style="color:var(--gd);margin-top:24px">Kumpulkan Lima Ramuan Panca Cinta</h3>
      <div class="grid">
        ${CH.slice(1).map((c, i) => `
          <a class="kc" href="#c${i+1}" style="--c:${c.c}">
            <small>PANCA CINTA ${i+1}</small>
            <h4>${c.e}${esc(c.n)}</h4>
            <div class="bar"><i data-b="${i+1}"></i></div>
          </a>
        `).join('')}
      </div>
      <p class="mut" style="margin-top:18px">Jawaban tersimpan otomatis di browser Anda. Tekan <b>Simpan &amp; Kirim</b> pada tiap lembar untuk sinkronisasi ke cloud.</p>
    </div>
  `;
}

function dash() {
  const p = prof();
  const ch = CH.map((c, i) => `
    <div class="row">
      <b>${c.e} ${i ? '#' + i + ' ' : ''}${esc(c.n)}</b>
      <div class="bar d" style="--c:${c.c}"><i data-b="${i}"></i></div>
      <em data-pc="${i}">0%</em>
    </div>
  `).join('');

  $('#main').innerHTML = `
    <div class="ban">
      <div class="big">📊</div>
      <h2>Dashboard Perkembangan</h2>
      ${HILL}
    </div>
    <div class="in">
      <div class="card">
        <div class="row">
          <div class="rg" style="--p:${pAll()}"><span>${pAll()}%</span></div>
          <div>
            <h3 style="margin:0">${esc(p.nama || 'Peserta Petualang')}</h3>
            <span class="mut">NIP/NIK: <code>${esc(p.nip || 'Belum diisi')}</code></span><br>
            <span class="mut">${esc(p.instansi || 'Instansi belum diisi')} ${esc(p.peran ? '(' + p.peran + ')' : '')}</span>
          </div>
        </div>
        ${ch}
        <h4 style="margin-top:16px;color:var(--gd)">Kartu Ramuan Panca Cinta Terkumpul (≥80%)</h4>
        <p style="font-size:24px;margin:6px 0">${CH.slice(1).map((c, i) => pc(i + 1) >= 80 ? c.e : '⬜').join(' ')}</p>
      </div>
      <div class="card">
        <h3>Statistik Seluruh Peserta Program</h3>
        <div id="gd" class="mut">Memuat data peserta...</div>
      </div>
    </div>
  `;
  gd();
}

async function fetchAPI(url, options = {}) {
  try {
    const res = await fetch(url, options);
    return await res.json();
  } catch(err) {
    if (options.body && typeof options.body === 'string') {
      const res = await fetch(url, { ...options, headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
      return await res.json();
    }
    throw err;
  }
}

async function syncUserData(nip) {
  if (!nip || !API) return;
  try {
    const res = await fetchAPI(`${API}${API.includes('?') ? '&' : '?'}act=load_user&nip=${encodeURIComponent(nip)}`);
    if (res && res.ok && res.answers) {
      st.pid = res.pid || nip;
      st.a = { ...st.a, ...res.answers };
      if (res.nama) st.a['c0s1.nama'] = res.nama;
      if (res.pid) st.a['c0s1.nip'] = res.pid;
      if (res.instansi) st.a['c0s1.instansi'] = res.instansi;
      if (res.peran) st.a['c0s1.peran'] = res.peran;
      save();
      prg();
    }
  } catch(e) {}
}

async function gd() {
  const e = $('#gd');
  if (!e) return;
  if (!API) {
    e.innerHTML = '<i>Layanan API belum dikonfigurasi secara lengkap.</i>';
    return;
  }
  try {
    const d = await fetchAPI(API + (API.includes('?') ? '&' : '?') + 'act=dash');
    if (!e) return;
    e.innerHTML = `
      <p>Total <b>${d.n}</b> peserta terdaftar · Rata-rata pencapaian <b>${d.avg}%</b></p>
      ${d.ch.map((v, i) => `
        <div class="row">
          <b>${CH[i].e}${esc(CH[i].n)}</b>
          <div class="bar d" style="--c:${CH[i].c}"><i style="width:${v}%"></i></div>
          <em>${v}%</em>
        </div>
      `).join('')}
      <h4 style="margin-top:16px;color:var(--gd)">Top 10 Peserta Paling Aktif</h4>
      <table>
        <thead><tr><th>#</th><th>Nama / NIP / Instansi</th><th>Progres</th></tr></thead>
        <tbody>
          ${d.top.map((t, i) => `
            <tr>
              <td>${i + 1}</td>
              <td><b>${esc(t.nama || '(Tanpa Nama)')}</b> <small class="mut">(${esc(t.nip || '-')})</small><br><small class="mut">${esc(t.instansi || '-')}</small></td>
              <td><b>${t.total}%</b></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (x) {
    e.textContent = 'Gagal memuat statistik global. Silahkan muat ulang...';
  }
}

function prg() {
  document.querySelectorAll('[data-pc]').forEach(e => e.textContent = pc(+e.dataset.pc) + '%');
  document.querySelectorAll('[data-b]').forEach(e => e.style.width = pc(+e.dataset.b) + '%');
  const q = $('#qb');
  if (q) {
    q.style.display = st.q.length ? 'inline-block' : 'none';
    q.textContent = '⏳ ' + st.q.length + ' Antrean Kirim';
  }
}

function upd(id) {
  const s = S.find(x => x.id === id);
  const r = $('#r-' + id);
  if (r && s) {
    const c = co2(st.a[id + '.co']);
    r.innerHTML = `Estimasi Jejak Karbon Anda: <b>${c.kg.toFixed(1)} kg CO₂/bulan</b> · Wajib Adopsi ± <b>${c.tr} Pohon/Tahun</b> 🌳<br><small class="mut">Kalkulasi kasar; gunakan fitur GoGreener di Gojek untuk data resmi.</small>`;
  }
  prg();
}

document.addEventListener('input', onIn);
document.addEventListener('change', onIn);

function onIn(e) {
  const t = e.target;
  const k = t.dataset.k;
  const a = t.closest('article');
  if (!k || !a) return;

  const id = a.id;
  const key = id + '.' + k;
  let v = st.a[key];

  if (t.dataset.c !== undefined) {
    v = Array.isArray(v) ? v : [];
    v = t.checked ? [...new Set([...v, t.dataset.c])] : v.filter(x => x !== t.dataset.c);
  } else if (t.dataset.i !== undefined) {
    v = Array.isArray(v) ? v : [];
    const i = +t.dataset.i;
    v[i] = v[i] || ['', ''];
    v[i][t.dataset.p === 's' ? 0 : 1] = t.value;
  } else if (t.dataset.f) {
    v = typeof v === 'object' && v !== null ? v : {};
    v[t.dataset.f] = t.value;
  } else {
    v = t.value;
  }

  st.a[key] = v;
  
  if (key === 'c0s1.nip' && tr(v).length >= 5) {
    st.pid = tr(v);
    syncUserData(tr(v));
  }

  mark(id, '💾 Tersimpan di perangkat');
  save();
  upd(id);
}

const mark = (id, m) => { const e = $('#sv-' + id); if (e) e.textContent = m; };

function sub(id) {
  const s = S.find(x => x.id === id);
  const p = prof();
  
  if (!tr(p.nip)) {
    showModal('Mohon isi terlebih dahulu NIP/NIK Anda di Bab Orientasi (c0s1) sebagai Kunci Unik Identitas.', 'Identitas Belum Lengkap');
    location.hash = 'c0';
    return;
  }

  st.pid = tr(p.nip);
  const rows = s.f.map(f => [f.k, f.l || f.a || f.k, str(f, st.a[id + '.' + f.k])]).filter(r => tr(r[2]));
  
  if (!rows.length) {
    mark(id, 'Belum ada isian untuk dikirim.');
    return;
  }

  const pg = CH.map((_, i) => pc(i));
  st.q = st.q.filter(j => j.sec !== id);
  
  const payload = {
    sid: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
    pid: st.pid,
    nip: st.pid,
    ...p,
    sec: id,
    secTitle: s.t,
    ch: s.ch,
    rows,
    prog: pg,
    total: pAll(),
    tries: 0
  };

  st.q.push(payload);
  ls.set('kbc', JSON.stringify(st));

  mark(id, '⏳ Menyiapkan pengiriman...');
  prg();
  flush();
}

let busy = false;
async function flush() {
  if (busy || !API || !st.q.length) return;
  busy = true;

  while (st.q.length) {
    const j = st.q[0];
    try {
      const d = await fetchAPI(API, { method: 'POST', body: JSON.stringify(j) });
      if (!d.ok) throw new Error(d.err || 'Gagal');

      st.q.shift();
      mark(j.sec, '✅ Terkirim ' + new Date().toLocaleTimeString('id-ID'));
      
      if (d.answers) {
        st.a = { ...st.a, ...d.answers };
      }

      ls.set('kbc', JSON.stringify(st));
      prg();
    } catch (x) {
      j.tries++;
      mark(j.sec, '⚠️ Menunggu giliran kirim...');
      ls.set('kbc', JSON.stringify(st));
      if (j.tries > 8) break;
      await new Promise(r => setTimeout(r, Math.min(60000, 1500 * Math.pow(2, j.tries)) * (0.5 + Math.random())));
    }
  }
  busy = false;
}

window.addEventListener('online', flush);
setInterval(flush, 30000);
window.addEventListener('hashchange', route);

nav();
route();

if (prof().nip) {
  st.pid = prof().nip;
  syncUserData(prof().nip);
}
flush();
</script>
</body>
</html>
